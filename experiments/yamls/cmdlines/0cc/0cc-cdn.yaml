### Experiment runner yaml for KV-server benchmark (cdn trace)

time: 50
programs:
    start_server:
        ready_file: { "{folder}/ready.log": "ready" }
        host_type: "server"
        start: sudo env LD_LIBRARY_PATH={cornflakes_dir}/dpdk-datapath/3rdparty/dpdk/build/lib/x86_64-linux-gnu nice -n -19 taskset -c 2 {cornflakes_dir}/target/release/cdn_mlx5 --config_file {config_file} --server_ip {server_ip} --mode server --serialization {library} --copy_threshold {copy_threshold} --inline_mode {inline_mode} --push_buf_type {push_buf_type} --trace {trace_file} --key_size {key_size} --max_num_lines {max_num_lines} --debug_level info --num_pages {num_pages_per_mempool}{do_not_register_at_start} --zcc_pinning_limit {zcc_pinning_limit_2mb_pages} --zcc_segment_size {zcc_segment_size_2mb_pages}{zcc_pin_on_demand} --zcc_alg {zcc_alg} --zcc_sleep_duration {zcc_sleep_duration} --ready_file {folder}/ready.log{log_keys}{log_pinning_map}
        perf: sudo perf stat -e task-clock,cycles,instructions,cache-references,cache-misses,L1-dcache-loads,L1-dcache-load-misses,L1-dcache-stores,dTLB-loads,dTLB-load-misses,dTLB-prefetch-misses,LLC-loads,LLC-load-misses,LLC-stores,LLC-store-misses -o {folder}/server.perf.log
        log:
            out: "{folder}/{host}.log"
            err: "{folder}/{host}.err.log"
            keys: "{folder}/{host}_keymappings.log"
            pinning_map: "{folder}/{host}_pinning.log"
        binary_to_stop: "{cornflakes_dir}/target/release/cdn_mlx5"
        binary_name: "cdn_mlx5"
        stop: kill -9 `ps aux | grep {cornflakes_dir}/target/release/cdn_mlx5 | grep 'bash -c' | grep -v grep | awk '{{print $2}}'`

    start_client:
        host_type: "client"
        start: sudo env LD_LIBRARY_PATH={cornflakes_dir}/dpdk-datapath/3rdparty/dpdk/build/lib/x86_64-linux-gnu {cornflakes_dir}/target/release/cdn_dpdk --config_file {config_file} --mode client --server_ip {server_ip} --our_ip {client_ip} --push_buf_type singlebuf --serialization {client_library} --time {time} --rate {rate} --trace {trace_file} --max_num_lines {max_num_lines} --key_size {key_size} --num_threads {num_threads} --num_clients {num_machines} --client_id {machine_id} --threadlog {folder}/{host}.threads.log --debug_level info --per_size_info
        log:
            out: "{folder}/{host}.log"
            err: "{folder}/{host}.err.log"
            results: "{folder}/{host}.threads.log"

